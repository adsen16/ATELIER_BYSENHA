<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <meta
      name="description"
      content="Acrylic and pigment on linen, 2025."
    >

    <meta property="og:type" content="website">

    <meta
      property="og:title"
      content="Monsieur Vert — Atelier Adam"
    >

    <meta
      property="og:description"
      content="A collection of contemporary paintings."
    >

    <link rel="canonical" href="/">

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f3ee'/%3E%3Cpath d='M8 25L16 6L24 25M11 19H21' fill='none' stroke='%2323231f' stroke-width='2'/%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="/style.css?v=3">
  </head>

  <body>
    <!-- Header -->
    <header>
      <a class="brand" href="/">ATELIER</a>

      <button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-haspopup="dialog"
        data-cursor="OPEN"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Page content -->
    <main></main>

    <!-- Navigation -->
    <dialog
      id="menu"
      class="overlay"
      aria-label="Navigation"
    >
      <button
        class="close"
        data-close
        aria-label="Close navigation"
      >
        ×
      </button>

      <nav class="menu-content">
        <a href="/index/">Index</a>
        <a href="/about/">About</a>
        <button data-contact>Contact</button>
      </nav>

      <div class="menu-foot small">
        SELECTED WORKS / 2025—2026
      </div>
    </dialog>

    <!-- Contact -->
    <dialog
      id="contact"
      class="overlay"
      aria-label="Studio contact"
    >
      <button
        class="close"
        data-close
        aria-label="Close contact"
      >
        ×
      </button>

      <!-- Decorative rotating painting -->
      <div class="contact-painting" aria-hidden="true">
        <div class="contact-painting-float">
          <div class="contact-painting-spin">
            <div class="contact-painting-front">
              <img src="/images/artwork-02.jpg" alt="">
            </div>
            <div class="contact-edge contact-edge-left"></div>
            <div class="contact-edge contact-edge-right"></div>
            <div class="contact-edge contact-edge-top"></div>
            <div class="contact-edge contact-edge-bottom"></div>
          </div>
        </div>
      </div>

      <div class="contact-lines">
        <div>
          <p>EMAIL</p>

          <a href="mailto:adsen16@outlook.com">
            adsen16@outlook.com
          </a>
        </div>

        <div>
          <p>INSTAGRAM</p>

          <a
            href="https://www.instagram.com/adam_ijd/"
            target="_blank"
            rel="noopener"
          >
            @adam_ijd
          </a>
        </div>

        <div>
          <p>LOCATION</p>

          <span class="location">
            Paris / New York / Nanjing
          </span>
        </div>
      </div>
    </dialog>

    <!-- Custom cursor -->
    <div class="cursor" aria-hidden="true"></div>

    <script src="/app.js?v=3" defer></script>
  </body>
</html>
